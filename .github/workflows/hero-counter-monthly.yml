name: Scrape Hero Counter Data (Monthly)

on:
  schedule:
    # Jalan tiap tanggal 1 jam 18:00 UTC (01:00 WIB next day)
    - cron: "0 18 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-heroes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Run scrape.js
        run: node scrape.js

      - name: Commit & push result.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result.json
          git diff --staged --quiet || git commit -m "chore: update hero counter data $(date +'%Y-%m-%d')"
          git push
