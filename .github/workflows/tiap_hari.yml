name: Run Node Cron
on:
  schedule:
    - cron: "0 00 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install

      - run: node scraper.js

      - name: Commit images
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add *.png
          git commit -m "update images" || echo "no changes"
          git push

      - name: Send to Discord
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: node discord.js
