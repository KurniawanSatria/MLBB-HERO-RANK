name: Run Node Cron
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install puppeteer form-data

      - run: node src/scraper.js

      - name: Send to Discord
        env:
          WEBHOOK_WINRATE: ${{ secrets.WEBHOOK_WINRATE }}
          WEBHOOK_PICKRATE: ${{ secrets.WEBHOOK_PICKRATE }}
          WEBHOOK_BANRATE: ${{ secrets.WEBHOOK_BANRATE }}
        run: node src/discord.js
